<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Energy Monitor v2</title>
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --prod-color: #34c759;
            --cons-color: #ff3b30;
            --neutral-card: #2c2c2e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 22px; margin: 20px 0; font-weight: 600; }

        .dashboard {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            transition: background-color 0.8s ease;
        }

        #balance-card {
            padding: 40px 20px;
            background-color: var(--neutral-card);
        }

        .title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .value { font-size: 48px; font-weight: 800; margin: 10px 0; letter-spacing: -1px; }
        .sub-value { font-size: 16px; font-weight: 500; opacity: 0.9; }

        .row { display: flex; gap: 15px; width: 100%; }
        .small-card { flex: 1; padding: 20px 10px; }
        .small-card .value { font-size: 28px; }

        .history {
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 5px 20px;
            box-sizing: border-box;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #38383a;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item span:last-child { font-weight: bold; }
        
        .debug-note { font-size: 10px; color: #444; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Energy Monitor v2</h1>

    <div class="dashboard">
        <div class="card" id="balance-card">
            <div class="title">Bilancio Attuale</div>
            <div class="value" id="balance-val">0 W</div>
            <div class="sub-value" id="balance-status">Inizializzazione...</div>
        </div>

        <div class="row">
            <div class="card small-card">
                <div class="title">Produzione</div>
                <div class="value" id="prod-val" style="color: var(--prod-color)">0 W</div>
            </div>
            <div class="card small-card">
                <div class="title">Consumo</div>
                <div class="value" id="cons-val" style="color: var(--cons-color)">0 W</div>
            </div>
        </div>
    </div>

    <div class="history">
        <div class="history-item"><span>Produzione Oggi</span><span id="hist-today">-- kWh</span></div>
        <div class="history-item"><span>Produzione Ieri</span><span id="hist-yesterday">-- kWh</span></div>
        <div class="history-item"><span>Questa Settimana</span><span id="hist-week">-- kWh</span></div>
        <div class="history-item"><span>Questo Mese</span><span id="hist-month">-- kWh</span></div>
        <div class="history-item"><span>Totale Storico</span><span id="hist-total">-- kWh</span></div>
    </div>

    <div class="debug-note">* I dati storici vengono elaborati dal telefono</div>
