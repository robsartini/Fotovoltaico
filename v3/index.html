<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Energy Monitor v4 - Cloud Sync</title>
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --prod-color: #34c759;
            --cons-color: #ff3b30;
            --neutral-card: #2c2c2e;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border-radius: 25px; padding: 20px; text-align: center; }
        #balance-card { padding: 40px 20px; background: var(--neutral-card); }
        .title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .value { font-size: 48px; font-weight: 800; margin: 10px 0; }
        .row { display: flex; gap: 15px; }
        .small-card { flex: 1; }
        .history { width: 100%; max-width: 400px; margin-top: 30px; background: var(--card-bg); border-radius: 20px; padding: 10px 20px; }
        .history-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #38383a; }
        .sync-status { font-size: 10px; color: #34c759; margin-top: 10px; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="card" id="balance-card">
            <div class="title">Bilancio Attuale</div>
            <div class="value" id="balance-val">0 W</div>
            <div id="balance-status">Inizializzazione...</div>
        </div>
        <div class="row">
            <div class="card small-card"><div class="title">Produzione</div><div class="value" id="prod-val" style="color:var(--prod-color); font-size:24px;">0 W</div></div>
            <div class="card small-card"><div class="title">Consumo</div><div class="value" id="cons-val" style="color:var(--cons-color); font-size:24px;">0 W</div></div>
        </div>
    </div>

    <div class="history">
        <div class="history-item"><span>Produzione Oggi</span><span id="hist-today">-- kWh</span></div>
        <div class="history-item"><span>Totale Storico</span><span id="hist-total">-- kWh</span></div>
        <div id="sync-info" class="sync-status">Cloud: In attesa...</div>
    </div>

    <script>
        let lastSyncDate = "";

        async function sincronizzaGoogle(totaleWh) {
            const oggi = new Date().toDateString();
            // Sincronizza solo una volta per ogni apertura o se cambia il giorno
            if (lastSyncDate === oggi) return;

            const googleUrl = "https://script.google.com/macros/s/AKfycbxZa2PpGKbs3Oowif9z3PQYj3ggtsqzAn9N0YLTO3R5Q5fsrIOEAI-xTIw8E-mbmkVO0w/exec"; 
            const urlCompleto = `${googleUrl}?totale=${totaleWh}&key=${SHELLY_CONFIG.AUTH_KEY}`;

            try {
                document.getElementById('sync-info').innerText = "Cloud: Sincronizzazione...";
                await fetch(urlCompleto, { mode: 'no-cors' });
                lastSyncDate = oggi;
                document.getElementById('sync-info').innerText = "Cloud: Dati salvati su Google Sheets";
            } catch (e) {
                document.getElementById('sync-info').innerText = "Cloud: Errore sincro";
            }
        }

function updateUI(prod, cons, totalAll) {
            prod = Math.abs(prod); cons = Math.abs(cons);
            const bilancio = prod - cons;
            document.getElementById('prod-val').innerText = Math.round(prod) + " W";
            document.getElementById('cons-val').innerText = Math.round(cons) + " W";
            document.getElementById('balance-val').innerText = (bilancio > 0 ? "+" : "") + Math.round(bilancio) + " W";
            
            const statusEl = document.getElementById('balance-status');
            const balanceCard = document.getElementById('balance-card');
            
            if (bilancio < 0) {
                balanceCard.style.backgroundColor = "#2c2c2e"; // Colore neutro o rosso scuro
                statusEl.innerText = "Stai prelevando energia";
            } else {
                balanceCard.style.backgroundColor = "#1c1c1e"; // Colore base o verde scuro
                statusEl.innerText = "Stai vendendo energia";
            }
            // ---------------------------------------

            if (totalAll) {
                document.getElementById('hist-total').innerText = (totalAll / 1000).toFixed(1) + " kWh";
                sincronizzaGoogle(totalAll);
            }
        }

        async function fetchShellyData() {
            try {
                const url = `${SHELLY_CONFIG.SERVER_URL}/device/status?id=${SHELLY_CONFIG.DEVICE_ID}&auth_key=${SHELLY_CONFIG.AUTH_KEY}`;
                const response = await fetch(url);
                const json = await response.json();
                if (json.isok) {
                    const s = json.data.device_status;
                    updateUI(s.emeters[0].power, s.emeters[1].power, s.emeters[0].total);
                }
            } catch (e) { console.error(e); }
        }

        setInterval(fetchShellyData, 10000);
        fetchShellyData();
    </script>
</body>
</html>
